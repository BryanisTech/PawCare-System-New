<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
    <body>

        <div class="relative
                    w-full
                    min-h-screen 
                    bg-cover
                    bg-center
                    bg-no-repeat
                    flex 
                    items-center 
                    justify-center
                    overflow-hidden"
                    style="background-image: url('./img/gradient.png');">

                <div class="absolute top-10 left-20
                        w-72 h-72
                        bg-white/30
                        rounded-full
                        blur-3xl">
                </div>

                <div class="absolute bottom-10 right-20
                            w-80 h-80
                            bg-pink-300/30
                            rounded-full
                            blur-3xl">
                </div>

                <img src="./img/pink.png" class="absolute top-12 right-20 w-35 opacity-30 rotate-20">

                <img src="./img/pink.png" class="absolute bottom-20 left-24 w-45 opacity-25 -rotate-20">

                <img src="./img/brown.png" class="absolute top-[45%] right-16 w-16 opacity-10">

                <div class="absolute -bottom-75 -right-37.5 w-212.5 h-125 rounded-[50%] border-2 border-white/40"></div>

                <div class="relative z-10 w-full max-w-2xl px-9 py-10 bg-white/35 border border-white/60 rounded-[28px] backdrop-blur-xl shadow-[0_20px_60px_rgba(120,50,80,0.20)]">


    <!-- Heading -->
    <h4 class="text-center mb-2 text-3xl font-bold text-[#3D3032] leading-tight">
        Create an Account <br>
    </h4>
    <p class="text-center mb-4 text-sm text-[#3D3032]">
        Sign up to get started!
    </p>

    <!-- Pink Divider -->
    <div class="w-10 h-0.75 bg-pink-400 rounded-full mx-auto mt-4 mb-8"></div>

    <form action="/register" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-5" id="registerForm">

        <!-- Column 1: Full Name -->
        <div class="relative">
            <label for="username" class="block mb-2 text-sm font-semibold text-[#3D3032]">Full Name:</label>
            <div class="relative">
                <!-- User Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400 pointer-events-none">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
                <input type="text" id="username" name="username" placeholder="Ex. John Smith" required
                       class="w-full h-12 pl-12 pr-4 rounded-xl bg-white/30 backdrop-blur-md border border-white/60 text-sm font-medium text-[#3D3032] placeholder-[#B9A5A8] shadow-[0_4px_15px_rgba(255,255,255,0.15)] outline-none focus:bg-white/45 focus:border-pink-300 focus:ring-2 focus:ring-pink-300/30 transition duration-300">
            </div>
        </div>

        <!-- Column 2: Email -->
        <div class="relative">
            <label for="email" class="block mb-2 text-sm font-semibold text-[#3D3032]">Email:</label>
            <div class="relative">
                <!-- Mail Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400 pointer-events-none">
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <path d="m3 7 9 6 9-6"/>
                </svg>
                <input type="email" id="email" name="email" placeholder="john.smith@gmail.com" required
                       class="w-full h-12 pl-12 pr-4 rounded-xl bg-white/30 backdrop-blur-md border border-white/60 text-sm font-medium text-[#3D3032] placeholder-[#B9A5A8] shadow-[0_4px_15px_rgba(255,255,255,0.15)] outline-none focus:bg-white/45 focus:border-pink-300 focus:ring-2 focus:ring-pink-300/30 transition duration-300">
            </div>
        </div>

        <!-- Column 1: Phone Number -->
        <div class="relative">
            <label for="phonenumber" class="block mb-2 text-sm font-semibold text-[#3D3032]">Phone Number:</label>
            <div class="relative">
                <!-- Phone Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400 pointer-events-none">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                </svg>
                <input type="tel" id="phonenumber" name="phonenumber" placeholder="Ex. 09XXXXXXXXX" inputmode="numeric" pattern="09[0-9]{9}" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required
                       class="w-full h-12 pl-12 pr-4 rounded-xl bg-white/30 backdrop-blur-md border border-white/60 text-sm font-medium text-[#3D3032] placeholder-[#B9A5A8] shadow-[0_4px_15px_rgba(255,255,255,0.15)] outline-none focus:bg-white/45 focus:border-pink-300 focus:ring-2 focus:ring-pink-300/30 transition duration-300">
            </div>
        </div>

        <!-- Column 2: Address -->
        <div class="relative">
            <label for="address" class="block mb-2 text-sm font-semibold text-[#3D3032]">Address:</label>
            <div class="relative">
                <!-- Map Pin Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400 pointer-events-none">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                </svg>
                <input type="text" id="address" name="address" placeholder="Ex. 123 Main St" required
                       class="w-full h-12 pl-12 pr-4 rounded-xl bg-white/30 backdrop-blur-md border border-white/60 text-sm font-medium text-[#3D3032] placeholder-[#B9A5A8] shadow-[0_4px_15px_rgba(255,255,255,0.15)] outline-none focus:bg-white/45 focus:border-pink-300 focus:ring-2 focus:ring-pink-300/30 transition duration-300">
            </div>
        </div>

       <!-- Main Password Field (May Eye Icon) -->
<div class="mb-4">
    <label for="password" class="block mb-2 text-sm font-semibold text-[#3D3032]">
        Password:
    </label>
    
    <div class="relative">
        <!-- Lock Icon sa kaliwa -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400 pointer-events-none">
            <rect x="5" y="10" width="14" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>

        <input type="password" id="password" name="password" placeholder="Enter your password" required
               class="w-full h-12 pl-12 pr-12 rounded-xl bg-white/30 backdrop-blur-md border border-white/60 text-sm font-medium text-[#3D3032] placeholder-[#B9A5A8] shadow-[0_4px_15px_rgba(255,255,255,0.15)] outline-none focus:bg-white/45 focus:border-pink-300 focus:ring-2 focus:ring-pink-300/30 transition duration-300">
        
        <!-- Eye Toggle Button sa kanan -->
        <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#B9A5A8] hover:text-[#3D3032] transition-colors focus:outline-none">
            
            <!-- Eye Open Icon (Naka-show by default kapag encrypted) -->
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            
            <!-- Eye Closed Icon (Nakatago by default - may 'hidden' class) -->
            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
        </button>
    </div>
</div>

<!-- Confirm Password Field (Walang Eye Icon) -->
<div class="mb-4">
    <label for="confirm_password" class="block mb-2 text-sm font-semibold text-[#3D3032]">
        Confirm Password:
    </label>
    
    <div class="relative">
        <!-- Lock Icon sa kaliwa -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400 pointer-events-none">
            <rect x="5" y="10" width="14" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required
               class="w-full h-12 pl-12 pr-4 rounded-xl bg-white/30 backdrop-blur-md border border-white/60 text-sm font-medium text-[#3D3032] placeholder-[#B9A5A8] shadow-[0_4px_15px_rgba(255,255,255,0.15)] outline-none focus:bg-white/45 focus:border-pink-300 focus:ring-2 focus:ring-pink-300/30 transition duration-300">
    </div>

    <p id="passwordError" class="text-red-400 text-xs font-semibold mt-1 hidden">
        ❌ Passwords do not match!
    </p>
</div>

        <!-- Submit Button (Spans 2 columns) -->
        <div class="md:col-span-2 mt-2">
            <button type="submit" class="w-full text-white px-4 py-3 rounded-xl bg-linear-to-r from-pink-300 to-pink-500 font-semibold hover:scale-105 hover:shadow-xl duration-300 mb-6">
                Register
            </button>
            
            <!-- Login Link -->
            <div class="text-center text-sm text-[#3D3032]">
                Already Have an Account? 
                <a href="index.html" class="font-semibold text-[#D98C9A] hover:underline">
                    Login
                </a>
            </div>
        </div>

    </form>

</div>

        </div>

        <script src="script.js
        "></script>

    </body>

</html>
