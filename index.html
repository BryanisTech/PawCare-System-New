<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare</title>
    <link rel="stylesheet" href="./src/output.css">
 </head>
 <body>

    
   <div class="relative
               w-full
               min-h-screen 
               bg-cover
               bg-center
               bg-no-repeat
               flex 
               items-center 
               justify-center
               overflow-hidden"
        style="background-image: url('./img/gradient.png');">

        <div class="absolute top-10 left-20
                    w-72 h-72
                    bg-white/30
                    rounded-full
                    blur-3xl">
        </div>

        <div class="absolute bottom-10 right-20
                    w-80 h-80
                    bg-pink-300/30
                    rounded-full
                    blur-3xl">
        </div>

        <img src="./img/pink.png" class="absolute top-12 right-20 w-35 opacity-30 rotate-20">

        <img src="./img/pink.png" class="absolute bottom-20 left-24 w-45 opacity-25 -rotate-20">

        <img src="./img/brown.png" class="absolute top-[45%] right-16 w-16 opacity-10">

        <div class="absolute -bottom-75 -right-37.5 w-212.5 h-125 rounded-[50%] border-2 border-white/40"></div>

   
        <div class="relative z-10
                    w-97.5
                    max-w-[90%]
                    px-9
                    py-10
                    bg-white/35
                    border
                    border-white/60
                    rounded-[28px]
                    backdrop-blur-xl
                    shadow-[0_20px_60px_rgba(120,50,80,0.20)]">

             <div class="mx-auto mb-4
                         w-22 h-22
                         rounded-full
                         bg-white/60
                         border border-white/80
                         flex items-center justify-center
                         shadow-lg">
                    
                    <img src="./img/logo.png" class="w-20 h-20 object-contain">
            </div>

             <h4 class="text-center mb-10 text-3xl font-bold text-[#3D3032] leading-tight">
                Welcome to <br>
                PawCare
            </h4>

            <div class="w-10 h-0.75 bg-pink-400 rounded-full mx-auto mt-4 mb-8"></div>

            <form action="">
                
                <div class="mb-4">
                    <label 
                        for="email"
                        class="block mb-2 text-sm font-semibold text-[#3D3032]"
                    >
                        Email:
                    </label>

                    <div class="relative">

                        <svg 
                          xmlns="http://www.w3.org/2000/svg"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          class="absolute left-4 top-1/2 -translate-y-1/2
                              w-5 h-5 text-pink-400 pointer-events-none"
                        >
                          <rect x="3" y="5" width="18" height="14" rx="2"/>
                          <path d="m3 7 9 6 9-6"/>
                            
                        </svg>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        required
                        
                        class="w-full 
                            h-12
                            pl-12
                            pr-4
                            rounded-xl

                            bg-white/30
                            backdrop-blur-md
                            border border-white/60

                            text-sm
                            font-medium
                            text-[#3D3032]

                            placeholder-[#B9A5A8]

                            shadow-[0_4px_15px_rgba(255,255,255,0.15)]

                            outline-none

                            focus:bg-white/45
                            focus:border-pink-300
                            focus:ring-2
                            focus:ring-pink-300/30

                            transition duration-300"
                    >
                     </div>

                
                <div class="mb-4">
                    <label 
                        for="password"
                        class="block 
                        mb-2 
                        text-sm 
                        font-semibold 
                        text-[#3D3032]"
                    >
                        Password:
                    </label>

                    
                    <div class="relative">

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-pink-400 pointer-events-none"
                        >
                         <rect x="5" y="10" width="14" height="11" rx="2"/>
                         <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                         </svg>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                            
                            class="w-full 
                                h-12
                                pl-12
                                pr-12
                                rounded-xl

                                bg-white/30
                                backdrop-blur-md
                                border border-white/60

                                text-sm
                                font-medium
                                text-[#3D3032]

                                placeholder-[#B9A5A8]

                                shadow-[0_4px_15px_rgba(255,255,255,0.15)]

                                outline-none

                                focus:bg-white/45
                                focus:border-pink-300
                                focus:ring-2
                                focus:ring-pink-300/30

                                transition duration-300"
                        >
                        
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-[#B9A5A8] hover:text-[#3D3032] transition-colors focus:outline-none"
                        >
                            
                            <svg id="eyeOpen" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                            </svg>
                            
                            <svg id="eyeClosed" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="mb-5">

                    <label class="flex items-center gap-2
                                  text-sm font-semibold text-[#3d3032]
                                  cursor-pointer">

                                <input type="checkbox" class="w-4 h-4 accent-pink-500 cursor-pointer">

                                <span>Remember Me</span>
                            
                    </label>

                </div>

                <button type="submit" class="w-full text-white px-4 py-3 rounded-xl bg-linear-to-r from-pink-300 to-pink-500 font-semibold hover:scale-105 hover:shadow-xl duration-300 mb-6">Login</button>

                <div class="register text-center text-sm text-[#3D3032]">
                    Don't Have an Account? 
                    <a href="#" class="font-semibold text-[#D98C9A] hover:underline">
                        Register
                    </a>
                </div>


            </form>



        </div>

    </div>
    
    
   <script src="script.js"></script>
    
 </body>
 </html>
